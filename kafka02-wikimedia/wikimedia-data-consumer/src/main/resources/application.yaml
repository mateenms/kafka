spring:
  application:
    name: wikimedia-data-consumer

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: wikimedia-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      # create-drop  → recreate schema on every restart (dev only)
      # update       → add missing columns without dropping data
      # validate     → check schema matches entities, fail if not
      # none         → do nothing (prod)
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# ── Wikimedia topic ───────────────────────────────────────────────────────────
wikimedia:
  kafka:
    topic: wikimedia-recent-change

server:
  port: 8083
