// Kafka Broker JAAS Configuration — SASL/PLAIN
// This file tells the Kafka broker who is allowed to connect and with what credentials
// Mounted into the Kafka container at /etc/kafka/kafka_server_jaas.conf

KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    // The broker's own credentials (used for inter-broker communication)
    username="admin"
    password="admin-secret"
    // Client credentials — add one line per user
    user_admin="admin-secret"
    user_order-service="order-secret"
    user_payment-service="payment-secret"
    user_shipping-service="shipping-secret"
    user_dlt-handler="dlt-secret"
    user_audit-service="audit-secret"
    user_avro-service="avro-secret";
};

// Client JAAS — used when broker connects to itself (inter-broker)
KafkaClient {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret";
};
