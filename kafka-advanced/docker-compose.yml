version: '3.8'

services:

  # ──────────────────────────────────────────────
  # Zookeeper — Kafka cluster coordinator
  # ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Kafka — Message broker
  # ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Schema Registry — Centralized Avro schema storage
  # Producers register schemas here before sending.
  # Consumers fetch schemas to deserialize messages.
  # http://localhost:8091
  # ──────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    ports:
      - "8091:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Kafka UI — Visual topic & consumer group browser
  # Also shows Schema Registry subjects and schemas
  # http://localhost:8080
  # ──────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-advanced
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Kafka Connect — Distributed data pipeline framework
  # Reads from Kafka topics and sinks data into external systems (PostgreSQL, S3, etc.)
  # REST API at http://localhost:8083 to register and manage connectors
  # ──────────────────────────────────────────────
  kafka-connect:
    build: ./kafka-connect
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect-group
      # Internal topics Kafka Connect uses to store config, offsets, and status
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    depends_on:
      - kafka
      - postgres
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # PostgreSQL — Payment service persistence
  # Credentials: postgres / postgres
  # Database: paymentdb
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres-payment
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paymentdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Elasticsearch — Log storage
  # http://localhost:9200
  # ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - kafka-advanced-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # Logstash — Receives logs from services, ships to Elasticsearch
  # Listens on port 5000 (TCP JSON)
  # ──────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    ports:
      - "5000:5000/tcp"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - kafka-advanced-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Kibana — Log visualisation dashboard
  # http://localhost:5601
  # ──────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - kafka-advanced-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Zipkin — Distributed tracing
  # http://localhost:9411
  # ──────────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - kafka-advanced-net

networks:
  kafka-advanced-net:
    driver: bridge

volumes:
  postgres-data:
  elasticsearch-data:
