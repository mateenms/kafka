version: '3.8'

services:

  # ──────────────────────────────────────────────
  # Zookeeper — Kafka cluster coordinator
  # ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Kafka — Message broker
  # ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Kafka UI — Visual topic & consumer group browser
  # http://localhost:8080
  # ──────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-advanced
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # PostgreSQL — Payment service persistence
  # Credentials: postgres / postgres
  # Database: paymentdb
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres-payment
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paymentdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kafka-advanced-net

  # ──────────────────────────────────────────────
  # Elasticsearch — Log storage
  # http://localhost:9200
  # ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - kafka-advanced-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # Logstash — Receives logs from services, ships to Elasticsearch
  # Listens on port 5000 (TCP JSON)
  # ──────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    ports:
      - "5000:5000/tcp"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - kafka-advanced-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Kibana — Log visualisation dashboard
  # http://localhost:5601
  # ──────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - kafka-advanced-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Zipkin — Distributed tracing
  # http://localhost:9411
  # ──────────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - kafka-advanced-net

networks:
  kafka-advanced-net:
    driver: bridge

volumes:
  postgres-data:
  elasticsearch-data:
