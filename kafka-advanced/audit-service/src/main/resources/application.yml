# ──────────────────────────────────────────────
# Application Identity
# ──────────────────────────────────────────────
spring:
  application:
    name: audit-service

# ──────────────────────────────────────────────
# Kafka — Streams Configuration
# ──────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092

    topic:
      # Input topic — reads order events produced by order-service
      order-events: order-events

      # Output topics — written by Kafka Streams automatically
      # order-count-per-customer: running count of orders per customerId
      order-count-per-customer: order-count-per-customer

      # revenue-per-product: running total revenue per product name
      revenue-per-product: revenue-per-product

    # Kafka Streams needs a consumer to read the input topic
    # This is handled internally by the Streams DSL — not a manual @KafkaListener
    consumer:
      auto-offset-reset: earliest

    # Streams properties are set in KafkaStreamsConfig.java
    # application-id: audit-service-streams (set in config class)
    # commit-interval: 1000ms (set in config class)

# ──────────────────────────────────────────────
# Server Configuration
# ──────────────────────────────────────────────
server:
  port: 8084

# ──────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.mateen: DEBUG
    org.apache.kafka.streams: INFO
