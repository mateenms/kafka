# ──────────────────────────────────────────────
# Application Identity
# ──────────────────────────────────────────────
spring:
  application:
    name: dlt-handler-service

# ──────────────────────────────────────────────
# Kafka — Consumer Configuration
# ──────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092

    topic:
      # This service ONLY consumes from the dead letter topic
      # Messages arrive here after payment-service exhausted all retries
      order-events-dlt: order-events-dlt

    consumer:
      group-id: dlt-handler-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# ──────────────────────────────────────────────
# Server Configuration
# ──────────────────────────────────────────────
server:
  port: 8085

# ──────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.mateen: DEBUG
